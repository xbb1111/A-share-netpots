name: Deploy Financial Report API

on:
  schedule:
    - cron: '30 23 * * 1-5'
  push:
    branches: [main]
    paths:
      - server/financial-report-api.mjs
      - server/financial-report-worker.mjs
      - server/sentiment-metrics.mjs
      - server/sentiment-seed.mjs
      - scripts/build-sentiment-seed.mjs
      - scripts/enrich-sentiment-seed.mjs
      - wrangler.toml
      - package.json
      - package-lock.json
      - .github/workflows/financial-report-worker.yml
  workflow_dispatch:

concurrency:
  group: financial-report-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Refresh market sentiment snapshot
        run: npm run sentiment:seed || npm run sentiment:enrich
      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run worker:deploy
